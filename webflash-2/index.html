<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP fallback for hosts that ignore the repo-root `_headers` (notably

       preview loads no third-party scripts (no React/Babel/unpkg), only
       Google Fonts CSS + first-party ES modules. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>WebFlash 2.0 — Sense360 Firmware Installer</title>
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="root"></div>
  <noscript>
    <p style="max-width:640px;margin:48px auto;padding:0 24px;font-family:system-ui,sans-serif;line-height:1.5;">
      WebFlash 2.0 needs JavaScript and a desktop Chromium browser (Chrome, Edge or Opera)
      with Web Serial to flash a Sense360 hub.
    </p>
  </noscript>

  <!-- Vanilla ES modules — no build step, no React/Babel runtime. -->
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
