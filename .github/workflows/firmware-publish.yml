name: "Publish: Deploy Site (auto on merge)"

# Publishes the static WebFlash site (and the generated firmware catalog) to
# GitHub Pages. The publish TRIGGER is push (see `on:` below); the publish GATE
# is the unit-test suite plus the "Assert required configs present" step.
#
# The deploy safety model — what stops a bad manifest from shipping — is the
# `manifest-health` guard suite (__tests__/manifest-health.test.js), the
# per-source `block_tokens` in firmware/sources.json, and the REQUIRED_CONFIGS
# allowlist in this file. A failure in any of them fails CI before the deploy
# job runs. See docs/architecture.md for the full two-halves + deploy-gate
# explanation. (This is documentation only — it changes no trigger or step.)

on:
  push:
    branches: ['main']
    paths:
      - 'firmware/**'
      - 'scripts/**'
      - 'manifest.json'
      - 'firmware-*.json'
      - '.github/workflows/firmware-publish.yml'
      # Web interface files
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'css/**'
      - 'assets/**'
      - '*.png'
      - '_headers'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    # Unit-test gate. A failure here blocks the build and Pages deploy jobs.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test -- --ci

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Run Python unit tests
        # Covers the release-body sidecar automation in scripts/sync-from-releases.py
        # (and the gen-manifests sidecar-merge surface it relies on). Uses only
        # stdlib so no pip install is required for the test step itself.
        run: python -m unittest discover -s __tests__/python -p 'test_*.py' -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Sync firmware assets from release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/sync-from-releases.py \
            --repo "${GITHUB_REPOSITORY}" \
            --release-id "${{ github.event.release.id }}" \
            --target-dir firmware


      - name: Validate firmware naming policy
        run: |
          set -euo pipefail
          node scripts/validate-naming-policy.js firmware/configurations

      - name: Install firmware-signing dependencies
        # Ed25519 firmware signing requires the `cryptography` package.
        # Failing to install here would cause gen-manifests.py to refuse
        # to sign, which in turn would fail the production-mode validation
        # gate (manifests without signature_ed25519 are rejected).
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install cryptography

      - name: Generate firmware manifests
        env:
          # Production runs override the committed dev key with the real
          # signing key from CI secrets. The dev key shipped in the repo
          # is marked 'test_only' in the trust list — gen-manifests.py
          # refuses to use it in --mode production. PR builds (no
          # secret available) therefore drop to --mode development so
          # they can still produce a manifest for end-to-end testing,
          # but those manifests are NOT accepted by the deployed wizard.
          WEBFLASH_FIRMWARE_PRIVATE_KEY_B64: ${{ secrets.WEBFLASH_FIRMWARE_PRIVATE_KEY_B64 }}
          WEBFLASH_FIRMWARE_KEY_ID: ${{ secrets.WEBFLASH_FIRMWARE_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -n "${WEBFLASH_FIRMWARE_PRIVATE_KEY_B64:-}" ]; then
            echo "Production signing key provided; running gen-manifests in --mode production."
            SIGN_MODE="production"
          else
            echo "::warning::No production signing key in CI secrets; falling back to --mode development with the committed test_only dev key. The resulting manifest will NOT be accepted by the deployed wizard."
            SIGN_MODE="development"
          fi
          python scripts/gen-manifests.py \
            --firmware-dir firmware \
            --manifest-path manifest.json \
            --manifest-prefix firmware- \
            --mode "${SIGN_MODE}" \
            --summary

      - name: Report manifest metadata findings
        # Trust-signal validation: description / modules / file-size / release-note
        # checks against the freshly generated manifest. Fails closed so any
        # finding (missing changelog, drifted description, suspicious size, etc.)
        # blocks the Pages deploy job that depends on this build.
        env:
          WEBFLASH_FIRMWARE_PRIVATE_KEY_B64: ${{ secrets.WEBFLASH_FIRMWARE_PRIVATE_KEY_B64 }}
          WEBFLASH_FIRMWARE_KEY_ID: ${{ secrets.WEBFLASH_FIRMWARE_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -n "${WEBFLASH_FIRMWARE_PRIVATE_KEY_B64:-}" ]; then
            SIGN_MODE="production"
          else
            SIGN_MODE="development"
          fi
          python scripts/gen-manifests.py \
            --firmware-dir firmware \
            --manifest-path manifest.json \
            --manifest-prefix firmware- \
            --mode "${SIGN_MODE}" \
            --dry-run

      - name: Validate release-note channel policy
        run: |
          set -euo pipefail
          invalid_preview_notes=$(find firmware/configurations -maxdepth 1 -type f \( -name '*-preview.md' -o -name '*-beta.md' -o -name '*-dev.md' \))
          if [ -n "${invalid_preview_notes}" ]; then
            echo "❌ Preview/Beta/Dev release notes are not allowed in firmware/configurations:" >&2
            echo "${invalid_preview_notes}" >&2
            echo "Move non-stable notes to firmware/previews/." >&2
            exit 1
          fi
          echo "✅ Release-note policy validated (stable-only in firmware/configurations)."

      - name: List firmware & dry-run summary
        env:
          WEBFLASH_FIRMWARE_PRIVATE_KEY_B64: ${{ secrets.WEBFLASH_FIRMWARE_PRIVATE_KEY_B64 }}
          WEBFLASH_FIRMWARE_KEY_ID: ${{ secrets.WEBFLASH_FIRMWARE_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -n "${WEBFLASH_FIRMWARE_PRIVATE_KEY_B64:-}" ]; then
            SIGN_MODE="production"
          else
            SIGN_MODE="development"
          fi
          echo "== .bin files =="
          find firmware -type f -name '*.bin' -printf '%p\n' | sort
          echo "== gen-manifests dry-run summary =="
          python scripts/gen-manifests.py \
            --firmware-dir firmware \
            --manifest-path manifest.json \
            --manifest-prefix firmware- \
            --mode "${SIGN_MODE}" \
            --summary --dry-run

      - name: Assert required configs present
        run: |
          set -euo pipefail
          # =============================================================
          # Currently ship-ready configurations
          # =============================================================
          # REQUIRED_CONFIGS represents the configs WebFlash can actually
          # ship today — i.e. those backed by a real signed `.bin` on disk
          # and (for cross-repo imports) a matching entry in
          # firmware/sources.json. The deployed installer will fail at
          # flash-time for anything else, so the publish guard refuses to
          # deploy unless every entry below has a manifest build.
          #
          # Today that is exactly two configs:
          #   - Ceiling-POE-VentIQ-RoomIQ — current Release-One, imported
          #     from sense360store/esphome-public v1.0.0.
          #   - Rescue                    — standalone unbricking build.
          #
          # Legacy configs (Ceiling-POE-AirIQ, Ceiling-POE-VentIQ,
          # Ceiling-PWR-AirIQ, Ceiling-USB, Ceiling-USB-AirIQ,
          # Ceiling-USB-FanPWM, Ceiling-Voice-POE-AirIQ, Ceiling-Voice-USB)
          # were removed by WF-CLEANUP-004 because their `.bin` files are
          # not on disk and they have no source entry. They can be re-added
          # here only after their firmware is re-imported (via
          # firmware/sources.json + scripts/import-firmware-sources.py) and
          # validated end-to-end.
          # =============================================================

          REQUIRED_CONFIGS=(
            "Ceiling-POE-VentIQ-RoomIQ"
            "Rescue"
          )

          missing=0
          for k in "${REQUIRED_CONFIGS[@]}"; do
            if ! grep -qi "\"config_string\": *\"$k\"" manifest.json; then
              echo "❌ Missing config: $k" >&2
              missing=$((missing + 1))
            else
              echo "✓ Found: $k"
            fi
          done

          if [ $missing -gt 0 ]; then
            echo ""
            echo "❌ $missing required config(s) missing from manifest.json" >&2
            exit 1
          fi

          echo ""
          echo "✅ All ${#REQUIRED_CONFIGS[@]} required configurations present"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Upload repo root so the fresh manifest.json is included
          path: ./

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      # Re-export the deployed origin so the smoke-test job can hit it.
      # actions/deploy-pages emits e.g. https://sense360store.github.io/WebFlash/
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  smoke-test:
    # Post-deploy production smoke test: verifies the live origin actually
    # serves a production-acceptable manifest (correct source_commit, no
    # dev-key signatures on stable builds, no placeholder bins, required
    # release-one config + rescue firmware present, installer title
    # served on the root page). Read-only HTTP — does not flash hardware
    # and does not regenerate the manifest.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Verify deployed manifest
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ -z "${PAGE_URL:-}" ]; then
            echo "❌ deploy job did not export page_url; cannot smoke-test." >&2
            exit 1
          fi
          python scripts/smoke-test-deployment.py \
            --base-url "${PAGE_URL}" \
            --expected-commit "${GITHUB_SHA}"
