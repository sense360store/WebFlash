<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      Content-Security-Policy fallback for hosts that ignore the repo-root
      `_headers` file (notably GitHub Pages). Mirrors the policy in `_headers`
      minus directives that cannot be enforced from a meta tag
      (frame-ancestors, report-uri, sandbox). X-Frame-Options / frame-ancestors
      clickjacking protection is therefore unavailable on GitHub Pages and is
      a known limitation documented in README.md → "Deployment & security
      headers". Run `npm run check:headers -- <URL>` to audit a deployment.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' blob:; img-src 'self' data:; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
    <!-- Support-only app-shell build marker. These meta tags are read verbatim by
         scripts/services/diagnostics.js (buildAppSection) so the support bundle
         reports which app shell the live GitHub Pages page is running. Because
         index.html is always revalidated by Pages/CDN while the ESM module graph
         can be served stale, this marker rides on the always-fresh HTML — so even
         a stale-JS page reports the correct shell. Bump `webflash-app-shell`
         together with the `?v=` asset query below and the sw.js CACHE_NAME on every
         JS/CSS deploy. No secrets/PII here — it is copied into diagnostics. -->
    <meta name="webflash-app-version" content="1.0.1">
    <meta name="webflash-app-shell" content="2026-06-05-1">
    <title>Sense360 Firmware Installer</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./sense360-favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- The 2.0 view's font set (Inter incl. 650, plus JetBrains Mono). The href
         matches the one scripts/shell.js would otherwise inject, so the shell's
         idempotent ensureStylesheet() finds it and skips a duplicate load. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- The `?v=` asset query is the cache-bust token. Keep it in lockstep with
         APP_SHELL_BUILD in scripts/bootstrap.js, the sw.js CACHE_NAME, and the
         `webflash-app-shell` marker above so a stale Pages/CDN/service-worker copy
         can never be served after a deploy. See docs/deploy-notes.md.

         css/wizard-style.css is retained after the 1.0 view was removed because
         the rescue / recovery and error-log modals (scripts/layout/rescue-modal.js
         and error-log-modal.js, reused by the 2.0 view) render with its styles.
         The remaining sheets and the 2.0 app stylesheet (app.css, injected by
         scripts/shell.js) provide the rest of the presentation. -->
    <link rel="stylesheet" href="./css/wizard-style.css?v=202606051">
    <link rel="stylesheet" href="./css/capability-bar.css">
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./css/layout.css?v=202606051">
    <link rel="stylesheet" href="./css/device-qr.css">
    <link rel="stylesheet" href="./css/features.css">
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>
<body>
    <a class="skip-link" href="#wf2-main-content">Skip to main content</a>
    <!-- Global aria-live regions used by scripts/utils/a11y.js (announce()). They
         are programmatically populated and visually hidden via .sr-only. The 2.0
         view reaches them through the same engine a11y primitives the 1.0 view
         used, so they are shared infrastructure, not part of the removed view. -->
    <div id="webflash-a11y-live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="webflash-a11y-alert-region" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
    <noscript>
        <p class="wf-noscript">
            WebFlash needs JavaScript and a desktop Chromium browser (Chrome, Edge or Opera)
            with Web Serial to flash a Sense360 hub.
        </p>
    </noscript>

    <!-- Vanilla ES modules — no build step, no React/Babel runtime. bootstrap.js
         mounts the 2.0 view (scripts/shell.js) into this production shell, so it
         inherits this page's CSP, service worker, manifest, and headers. The
         cache-bust token rides on this always-revalidated HTML so the bootstrap
         loader (and the ESM module graph it pulls in) is fetched fresh on the
         first load after a deploy, never a stale CDN/SW copy. -->
    <script type="module" src="./scripts/bootstrap.js?v=202606051"></script>
</body>
</html>
